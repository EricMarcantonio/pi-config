name: Update forks

# Weekly: fast-forward the pinned forks from upstream, then open a PR that bumps each pin to the
# fork head the previous run saw. Nothing reaches settings.json without a reviewed merge.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-forks

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT. See README "Fork updates" for the permissions it needs.
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      BRANCH: bot/bump-pins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          persist-credentials: true

      - id: plan
        run: python3 -I .github/scripts/update_forks.py

      - name: Open or update the pin-bump PR
        if: steps.plan.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add settings.json
          git commit -m "Bump pinned forks"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file pr-body.md
          else
            gh pr create --base main --head "$BRANCH" --title "Bump pinned forks" --body-file pr-body.md
          fi

      - name: Fail on sync problems
        if: steps.plan.outputs.problems == 'true'
        run: |
          cat pr-body.md
          exit 1
